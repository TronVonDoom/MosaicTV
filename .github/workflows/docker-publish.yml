name: Build and publish Docker image

# Builds the image and pushes it to the GitHub Container Registry (GHCR), so
# Unraid and every other host just pull it — no building on the server.
#
#   vX.Y.Z tag   → :vX.Y.Z and :latest — what the install docs point everyone at
#   push to main → :edge — every commit, for the live box and anyone who opts in
#   any build    → :sha-<commit>, for soaking a branch (workflow_dispatch)
#
# :latest moves only on a release, so an install that auto-updates (Watchtower
# and friends) never takes an unreleased commit.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/tronvondoom/mosaictv

jobs:
  # Nothing is published that doesn't build, pass its tests and migrate every
  # earlier release's database cleanly (see ci.yml).
  verify:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      # What the app reports as its version (Settings → Maintenance, the log's
      # first line): the release for a tag, else the version it's building
      # towards plus the commit, so a bug report names the exact build.
      - name: App version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "app=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "app=$(node -p "require('./server/package.json').version")+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.app }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
