name: Build and publish Docker image

# Builds the image and pushes it to the GitHub Container Registry (GHCR), so
# Unraid and every other host just pull it — no building on the server.
#
#   vX.Y.Z tag   → :vX.Y.Z and :latest — what the install docs point everyone at
#   push to main → :edge — every commit, for the live box and anyone who opts in
#   any build    → :sha-<commit>, for soaking a branch (workflow_dispatch)
#
# :latest moves only on a release, so an install that auto-updates (Watchtower
# and friends) never takes an unreleased commit.
#
# Every tag is one multi-platform image: linux/amd64 and linux/arm64 (a
# Raspberry Pi, an ARM NAS, Docker on Apple Silicon). Each platform is built on
# a runner of its own kind — no emulation — and started once to see it comes
# up; then one manifest names both.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/tronvondoom/mosaictv

jobs:
  # Nothing is published that doesn't build, pass its tests and migrate every
  # earlier release's database cleanly (see ci.yml).
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Platform name
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      # What the app reports as its version (Settings → Maintenance, the log's
      # first line): the release for a tag, else the version it's building
      # towards plus the commit, so a bug report names the exact build.
      - name: App version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "app=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            version=$(sed -n 's/^  "version": *"\([^"]*\)".*/\1/p' server/package.json)
            echo "app=${version}+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # Pushed by digest only: the tags go on in the merge job, once every
      # platform is built and has started.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.app }}
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=${{ env.PLATFORM_PAIR }},mode=max

      # It starts, migrates an empty database, and finds ffmpeg.
      - name: Smoke test
        run: |
          docker run -d --name smoke -p 8688:8688 "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"
          for i in $(seq 1 60); do
            if health=$(curl -fsS http://localhost:8688/api/health); then
              echo "$health"
              echo "$health" | grep -q '"ffmpeg":true' && exit 0
              echo "ffmpeg missing"; break
            fi
            sleep 2
          done
          docker logs smoke
          exit 1

      - name: Note the digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download the digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Tag both platforms as one image
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"
